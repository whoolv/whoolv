name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-clara.svg?color_snake=#141414&color_dots=#ebe5d6,#d9c9a3,#b3a37f,#6e6450,#3a352c
            dist/cobrinha-escura.svg?color_snake=#f2dfb7&color_dots=#1f1d1a,#3a352c,#6e6450,#b3a37f,#f2dfb7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
