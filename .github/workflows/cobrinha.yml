name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-clara.svg?color_snake=#1a422f&color_dots=#e8dfc6,#c9c9a8,#8fa187,#4d6e58,#1a422f
            dist/cobrinha-escura.svg?color_snake=#f3ebd6&color_dots=#0b2218,#1a422f,#4d6e58,#a3ae94,#f3ebd6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
